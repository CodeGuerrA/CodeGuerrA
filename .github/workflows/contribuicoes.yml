# Atualiza o quadro de contribuições do README uma vez por dia.
# Usa só o token padrão da Action: com "Private contributions" ligado no perfil, o total já inclui o privado.
name: Atualizar quadro de contribuições

on:
  schedule:
    - cron: "0 9 * * *" # 06:00 em Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gerar o quadro
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/contrib.py "${{ github.repository_owner }}"
      - name: Salvar se mudou
        run: |
          if git diff --quiet -- assets/contribuicoes.svg; then
            echo "Quadro sem mudança."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribuicoes.svg
          git commit -m "Atualiza o quadro de contribuições"
          git push
